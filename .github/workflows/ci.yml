# Build and test the Rust workspaces.
#
# Two workspaces are exercised:
#   * 03_PROTO   — the RIINA compiler (riinac and 14 supporting crates)
#   * 05_TOOLING — build/verify tooling
#
# Toolchain is pinned to 1.84.0 to match 05_TOOLING/rust-toolchain.toml and
# the workspace.package.rust-version in 03_PROTO/Cargo.toml.
#
# Reproduce locally:
#   (cd 03_PROTO   && cargo build --release && cargo test --workspace)
#   (cd 05_TOOLING && cargo build --release && cargo test --workspace)

name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # NOTE: -D warnings is intentionally NOT set here. 05_TOOLING currently has
  # benign unused-variable / unused-comparison warnings that must be cleaned up
  # before warnings-as-errors can become a required CI gate.

jobs:
  rust:
    name: rust / ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - 03_PROTO
          - 05_TOOLING
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.84.0
        run: |
          set -euo pipefail
          rustup toolchain install 1.84.0 --profile minimal --component rustfmt,clippy
          rustup default 1.84.0
          rustc --version
          cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.workspace }}/target
          key: cargo-${{ runner.os }}-${{ matrix.workspace }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.workspace)) }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.workspace }}-

      - name: Build (release)
        working-directory: ${{ matrix.workspace }}
        run: cargo build --release --workspace --locked

      - name: Test (workspace)
        working-directory: ${{ matrix.workspace }}
        run: cargo test --workspace --locked --no-fail-fast
