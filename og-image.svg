<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b"/>
      <stop offset="100%" style="stop-color:#141416"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Border accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="#22d3ee" opacity="0.6"/>
  <!-- Logo mark -->
  <g transform="translate(80, 180)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#e4e4e7" stroke-width="10" stroke-linecap="square"/>
    <line x1="0" y1="40" x2="50" y2="40" stroke="#e4e4e7" stroke-width="10" stroke-linecap="square"/>
  </g>
  <!-- Title -->
  <text x="160" y="230" fill="#e4e4e7" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="300" letter-spacing="-2">
    RIINA
  </text>
  <text x="160" y="230" fill="#e4e4e7" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="300" letter-spacing="-2" opacity="0">
    RIINA
  </text>
  <!-- Tagline -->
  <text x="80" y="320" fill="#a1a1aa" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="400">
    Your code is
  </text>
  <text x="370" y="320" fill="#22d3ee" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="700">
    proven secure
  </text>
  <text x="680" y="320" fill="#a1a1aa" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="400">
    before it ships.
  </text>
  <!-- Stats bar -->
  <rect x="80" y="380" width="1040" height="1" fill="#27272a"/>
  <text x="80" y="430" fill="#8b8b95" font-family="monospace" font-size="18" letter-spacing="1">
    Coq-mechanized core  ·  9 generated lanes
  </text>
  <text x="80" y="460" fill="#8b8b95" font-family="monospace" font-size="18" letter-spacing="1">
    0 admitted  |  0 axioms  |  machine-checked (Coq)
  </text>
  <!-- Proof symbols -->
  <text x="80" y="540" fill="#22d3ee" font-family="monospace" font-size="16" opacity="0.4">
    &#8866; type_safety  &#8866; non_interference  &#8866; effect_soundness  &#8866; constant_time
  </text>
  <!-- Bottom accent -->
  <rect x="0" y="627" width="1200" height="3" fill="#d4a846" opacity="0.4"/>
</svg>
